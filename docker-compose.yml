services:
  postgres-source:
    image: postgres:16
    container_name: postgres-source
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${DB_SOURCE_NAME:-appdb}
      POSTGRES_USER: ${DB_SOURCE_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_SOURCE_PASSWORD:?Set DB_SOURCE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - ./source_data:/var/lib/postgresql/data
      - ./source/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./source/updated_at.sql:/docker-entrypoint-initdb.d/updated_at.sql

  postgres-target:
    image: postgres:16
    container_name: postgres-target
    environment:
      POSTGRES_DB: ${DB_TARGET_NAME:-appdb}
      POSTGRES_USER: ${DB_TARGET_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_TARGET_PASSWORD:?Set DB_TARGET_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - ./target_data:/var/lib/postgresql/data

  kafka:
    image: quay.io/debezium/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      NODE_ID: 1
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/kafka/9092'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - ./kafka_data:/var/lib/kafka/data 

  connect:
    image: quay.io/debezium/connect:3.7
    container_name: kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONSUMER_METADATA_MAX_AGE_MS: 5000
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DB_SOURCE_HOST: ${DB_SOURCE_HOST:-postgres-source}
      DB_SOURCE_PORT: ${DB_SOURCE_PORT:-5432}
      DB_SOURCE_USER: ${DB_SOURCE_USER:-postgres}
      DB_SOURCE_PASSWORD: ${DB_SOURCE_PASSWORD:?Set DB_SOURCE_PASSWORD in .env}
      DB_SOURCE_NAME: ${DB_SOURCE_NAME:-appdb}
      DB_TARGET_HOST: ${DB_TARGET_HOST:-postgres-target}
      DB_TARGET_PORT: ${DB_TARGET_PORT:-5432}
      DB_TARGET_USER: ${DB_TARGET_USER:-postgres}
      DB_TARGET_PASSWORD: ${DB_TARGET_PASSWORD:?Set DB_TARGET_PASSWORD in .env}
      DB_TARGET_NAME: ${DB_TARGET_NAME:-appdb}
    volumes:
      - ./connect_plugins:/var/lib/kafka/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - 5050:80
    depends_on:
      - postgres-source
      - postgres-target
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  metrics-exporter:
    image: docker:24.0-cli
    container_name: metrics-exporter
    depends_on:
      connect:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      CONNECT_URL: http://connect:8083
      LISTEN_HOST: 0.0.0.0
      PORT: 8000
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/app/scripts:ro
    working_dir: /app
    command: >
      sh -c "apk add --no-cache python3 && python3 /app/scripts/metrics_exporter.py --connect-url $$CONNECT_URL --listen-host $$LISTEN_HOST --port $$PORT"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    depends_on:
      metrics-exporter:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  source_data: 
  pgadmin_data:
  target_data:
  connect_plugins:
  kafka_data:
  grafana_data:
