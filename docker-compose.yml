services:
  postgres-source:
    image: postgres:16
    container_name: postgres-source
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${DB_SOURCE_NAME:-appdb}
      POSTGRES_USER: ${DB_SOURCE_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_SOURCE_PASSWORD:?Set DB_SOURCE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - ./source_data:/var/lib/postgresql/data
      - ./source/init.sql:/docker-entrypoint-initdb.d/init.sql

  postgres-target:
    image: postgres:16
    container_name: postgres-target
    environment:
      POSTGRES_DB: ${DB_TARGET_NAME:-appdb}
      POSTGRES_USER: ${DB_TARGET_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_TARGET_PASSWORD:?Set DB_TARGET_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - ./target_data:/var/lib/postgresql/data

  kafka:
    image: quay.io/debezium/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      NODE_ID: 1
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/kafka/9092'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - ./kafka_data:/var/lib/kafka/data 

  connect:
    image: quay.io/debezium/connect:3.7
    container_name: kafka-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      postgres-target:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONSUMER_METADATA_MAX_AGE_MS: 5000
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DB_SOURCE_HOST: ${DB_SOURCE_HOST:-postgres-source}
      DB_SOURCE_PORT: ${DB_SOURCE_PORT:-5432}
      DB_SOURCE_USER: ${DB_SOURCE_USER:-postgres}
      DB_SOURCE_PASSWORD: ${DB_SOURCE_PASSWORD:?Set DB_SOURCE_PASSWORD in .env}
      DB_SOURCE_NAME: ${DB_SOURCE_NAME:-appdb}
      DB_TARGET_HOST: ${DB_TARGET_HOST:-postgres-target}
      DB_TARGET_PORT: ${DB_TARGET_PORT:-5432}
      DB_TARGET_USER: ${DB_TARGET_USER:-postgres}
      DB_TARGET_PASSWORD: ${DB_TARGET_PASSWORD:?Set DB_TARGET_PASSWORD in .env}
      DB_TARGET_NAME: ${DB_TARGET_NAME:-appdb}
    volumes:
      - ./connect_plugins:/var/lib/kafka/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - 5050:80
    depends_on:
      - postgres-source
      - postgres-target
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin


volumes:
  source_data: 
  pgadmin_data:
  target_data:
  connect_plugins:
  kafka_data:
