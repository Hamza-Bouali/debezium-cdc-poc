<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>CDC Event Feed</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172b2a;
      --muted: #637572;
      --line: #d7e1dc;
      --paper: #f5f7f1;
      --surface: #ffffff;
      --green: #147d62;
      --green-pale: #e3f4ed;
      --blue: #286c8b;
      --blue-pale: #e6f2f7;
      --amber: #9b620e;
      --amber-pale: #fff3d8;
      --red: #a13c35;
      --red-pale: #fbe9e6;
      --shadow: 0 12px 36px rgba(23, 43, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--paper);
      background-image: linear-gradient(rgba(23, 43, 42, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 43, 42, 0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    button, select { font: inherit; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }
    .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .eyebrow { color: var(--green); font: 700 0.72rem/1.2 "SFMono-Regular", Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font: 600 2rem/1.05 Georgia, "Times New Roman", serif; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 0.94rem; }
    .live-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-pale); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); }
    .field { display: flex; align-items: center; gap: 9px; }
    .field label, .auto-refresh { color: var(--muted); font-size: 0.82rem; }
    select { min-height: 36px; padding: 6px 30px 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
    .toolbar-spacer { flex: 1; }
    .auto-refresh { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .auto-refresh input { accent-color: var(--green); }
    .refresh { min-height: 36px; padding: 0 13px; border: 1px solid var(--green); border-radius: 4px; background: var(--green); color: white; cursor: pointer; font-size: 0.84rem; font-weight: 650; }
    .refresh:hover { background: #0d6d54; }
    .refresh:disabled { opacity: 0.6; cursor: wait; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 18px 0 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .metric { min-width: 0; padding: 15px 18px; }
    .metric + .metric { border-left: 1px solid var(--line); }
    .metric-label { color: var(--muted); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .metric-value { margin-top: 6px; overflow: hidden; font: 600 1.13rem/1.25 Georgia, "Times New Roman", serif; text-overflow: ellipsis; white-space: nowrap; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 11px; }
    h2 { margin: 0; font: 600 1.2rem/1.2 Georgia, "Times New Roman", serif; }
    .result-count { color: var(--muted); font: 0.76rem "SFMono-Regular", Consolas, monospace; }
    .timeline { position: relative; display: grid; gap: 10px; }
    .timeline::before { position: absolute; top: 14px; bottom: 14px; left: 91px; width: 1px; background: var(--line); content: ""; }
    .event-row { position: relative; display: grid; grid-template-columns: 78px 1fr; gap: 28px; animation: arrive 220ms ease both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .event-time { padding-top: 17px; color: var(--muted); font: 0.73rem/1.4 "SFMono-Regular", Consolas, monospace; text-align: right; }
    .event-time time { display: block; color: var(--ink); font-weight: 700; }
    .event-card { position: relative; display: block; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: inherit; cursor: pointer; text-align: left; transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease; }
    .event-card::before { position: absolute; top: 20px; left: -34px; width: 9px; height: 9px; border: 2px solid var(--paper); border-radius: 50%; background: var(--green); box-shadow: 0 0 0 1px var(--line); content: ""; }
    .event-card:hover { z-index: 1; transform: translateY(-1px); border-color: #8db9a9; box-shadow: var(--shadow); }
    .event-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .operation { display: inline-flex; align-items: center; min-height: 23px; padding: 2px 8px; border-radius: 3px; font: 700 0.69rem "SFMono-Regular", Consolas, monospace; text-transform: uppercase; }
    .op-create { background: var(--green-pale); color: var(--green); }
    .op-update { background: var(--blue-pale); color: var(--blue); }
    .op-delete { background: var(--red-pale); color: var(--red); }
    .op-read { background: var(--amber-pale); color: var(--amber); }
    .op-other { background: #edf0ed; color: #52615d; }
    .table-name { font-weight: 700; }
    .record-key { color: var(--muted); font: 0.79rem "SFMono-Regular", Consolas, monospace; }
    .event-snippet { margin: 10px 0 0; overflow: hidden; color: #435653; font: 0.78rem/1.45 "SFMono-Regular", Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .event-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 0.72rem; }
    .empty, .error { padding: 34px 20px; border: 1px dashed var(--line); border-radius: 5px; color: var(--muted); text-align: center; }
    .error { border-color: #e6b1aa; color: var(--red); }
    dialog { width: min(820px, calc(100% - 28px)); max-height: min(88vh, 900px); padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); box-shadow: 0 28px 80px rgba(14, 33, 31, 0.28); }
    dialog::backdrop { background: rgba(17, 39, 36, 0.48); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 21px; border-bottom: 1px solid var(--line); }
    .dialog-title { margin: 0; font: 600 1.45rem Georgia, "Times New Roman", serif; }
    .dialog-meta { margin-top: 7px; color: var(--muted); font: 0.76rem/1.5 "SFMono-Regular", Consolas, monospace; }
    .close { width: 34px; height: 34px; flex: 0 0 34px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); cursor: pointer; font-size: 1.2rem; }
    .dialog-body { max-height: calc(88vh - 90px); padding: 18px 21px 22px; overflow: auto; }
    .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .image-panel h3 { margin: 0 0 8px; color: var(--muted); font: 700 0.72rem "SFMono-Regular", Consolas, monospace; text-transform: uppercase; }
    pre { min-height: 98px; max-height: 42vh; margin: 0; padding: 13px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; background: #f6f8f5; color: #213b36; font: 0.77rem/1.55 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    details { margin-top: 16px; }
    summary { color: var(--green); cursor: pointer; font-size: 0.84rem; font-weight: 700; }
    #eventRaw { margin-top: 9px; }
    @media (max-width: 650px) {
      .shell { padding: 22px 14px 40px; }
      .masthead { align-items: flex-start; flex-direction: column; gap: 12px; }
      h1 { font-size: 1.75rem; }
      .toolbar { gap: 12px; }
      .toolbar-spacer { display: none; }
      .summary { grid-template-columns: 1fr 1fr; }
      .metric { padding: 12px; }
      .metric:last-child { grid-column: 1 / -1; border-top: 1px solid var(--line); border-left: 0; }
      .timeline::before { left: 13px; }
      .event-row { grid-template-columns: 1fr; gap: 5px; padding-left: 29px; }
      .event-time { padding: 0 0 0 1px; text-align: left; }
      .event-time time { display: inline; margin-right: 7px; }
      .event-card::before { top: 16px; left: -21px; }
      .event-card { padding: 12px; }
      .image-grid { grid-template-columns: 1fr; }
      .dialog-head, .dialog-body { padding-right: 15px; padding-left: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <div class="eyebrow">CDC / Source stream</div>
        <h1>Change timeline</h1>
        <p class="subtitle">Recent Debezium records, newest first.</p>
      </div>
      <div class="live-state"><span class="live-dot"></span><span id="liveLabel">Connected</span></div>
    </header>

    <section class="toolbar" aria-label="Event filters">
      <div class="field">
        <label for="tableSelect">Source table</label>
        <select id="tableSelect">
          <option value="customers">customers</option>
          <option value="orders">orders</option>
        </select>
      </div>
      <div class="field">
        <label for="operationSelect">Operation</label>
        <select id="operationSelect">
          <option value="all">All operations</option>
          <option value="c">Create</option>
          <option value="u">Update</option>
          <option value="d">Delete</option>
          <option value="r">Snapshot</option>
          <option value="tombstone">Tombstone</option>
        </select>
      </div>
      <span class="toolbar-spacer"></span>
      <label class="auto-refresh"><input id="autoRefresh" type="checkbox" checked /> Auto-refresh</label>
      <button class="refresh" id="refreshBtn" type="button">Refresh now</button>
    </section>

    <section class="summary" aria-label="Stream summary">
      <div class="metric"><div class="metric-label">Selected table</div><div class="metric-value" id="tableName">customers</div></div>
      <div class="metric"><div class="metric-label">Newest offset</div><div class="metric-value" id="latestOffset">-</div></div>
      <div class="metric"><div class="metric-label">Visible events</div><div class="metric-value" id="messageCount">0</div></div>
    </section>

    <section aria-labelledby="timelineTitle">
      <div class="section-head"><h2 id="timelineTitle">Recent activity</h2><span class="result-count" id="resultCount">0 records</span></div>
      <div id="eventsList" class="timeline" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="eventDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head">
      <div><h2 class="dialog-title" id="dialogTitle">Event details</h2><div class="dialog-meta" id="dialogMeta"></div></div>
      <button class="close" id="closeDialog" type="button" aria-label="Close details">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="image-grid">
        <section class="image-panel"><h3>Before</h3><pre id="beforeImage"></pre></section>
        <section class="image-panel"><h3>After</h3><pre id="afterImage"></pre></section>
      </div>
      <details><summary>Full Debezium event</summary><pre id="eventRaw"></pre></details>
    </div>
  </dialog>

  <script>
    const tableSelect = document.getElementById('tableSelect');
    const operationSelect = document.getElementById('operationSelect');
    const refreshBtn = document.getElementById('refreshBtn');
    const autoRefresh = document.getElementById('autoRefresh');
    const eventsList = document.getElementById('eventsList');
    const eventDialog = document.getElementById('eventDialog');
    const operationNames = { c: 'Create', u: 'Update', d: 'Delete', r: 'Snapshot', tombstone: 'Tombstone' };
    let loadedEvents = [];
    let loading = false;

    function formatTime(value) {
      const date = new Date(Number(value));
      if (Number.isNaN(date.getTime())) return { time: 'Unknown time', date: '' };
      return { time: date.toLocaleTimeString(), date: date.toLocaleString() };
    }

    function operationClass(code) {
      return ({ c: 'op-create', u: 'op-update', d: 'op-delete', r: 'op-read' })[code] || 'op-other';
    }

    function makeText(tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value;
      return element;
    }

    function renderEvents() {
      const selectedOperation = operationSelect.value;
      const visible = loadedEvents.filter((event) => selectedOperation === 'all' || event.operation === selectedOperation);
      eventsList.replaceChildren();
      document.getElementById('messageCount').textContent = String(visible.length);
      document.getElementById('resultCount').textContent = `${visible.length} ${visible.length === 1 ? 'record' : 'records'}`;

      if (!visible.length) {
        eventsList.append(makeText('div', 'empty', loadedEvents.length ? 'No events match this operation.' : 'No events found for this table yet.'));
        return;
      }

      visible.forEach((event, index) => {
        const stamp = formatTime(event.timestamp);
        const row = makeText('article', 'event-row', '');
        const time = makeText('div', 'event-time', '');
        const timeElement = document.createElement('time');
        timeElement.dateTime = stamp.date;
        timeElement.textContent = stamp.time;
        time.append(timeElement, makeText('span', '', stamp.date));

        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'event-card';
        card.setAttribute('aria-label', `Open ${operationNames[event.operation] || 'unknown'} event for ${event.table}`);
        const top = makeText('div', 'event-top', '');
        top.append(
          makeText('span', `operation ${operationClass(event.operation)}`, operationNames[event.operation] || `Op ${event.operation || '?'}`),
          makeText('span', 'table-name', event.topic),
          makeText('span', 'record-key', `key ${JSON.stringify(event.key ?? 'null')}`)
        );
        const rowData = event.after || event.before || {};
        const snippet = makeText('div', 'event-snippet', JSON.stringify(rowData));
        const meta = makeText('div', 'event-meta', '');
        meta.append(
          makeText('span', '', `partition ${event.partition ?? 'n/a'}`),
          makeText('span', '', `offset ${event.offset ?? 'n/a'}`),
          makeText('span', '', 'View before / after')
        );
        card.append(top, snippet, meta);
        card.addEventListener('click', () => showDetails(event));
        row.append(time, card);
        row.style.animationDelay = `${Math.min(index, 8) * 18}ms`;
        eventsList.append(row);
      });
    }

    function showDetails(event) {
      const label = operationNames[event.operation] || `Operation ${event.operation || 'unknown'}`;
      document.getElementById('dialogTitle').textContent = `${label} / ${event.table}`;
      document.getElementById('dialogMeta').textContent = `${formatTime(event.timestamp).date} · partition ${event.partition ?? 'n/a'} · offset ${event.offset ?? 'n/a'} · key ${JSON.stringify(event.key ?? 'null')}`;
      document.getElementById('beforeImage').textContent = event.before === null || event.before === undefined ? 'No before image' : JSON.stringify(event.before, null, 2);
      document.getElementById('afterImage').textContent = event.after === null || event.after === undefined ? 'No after image' : JSON.stringify(event.after, null, 2);
      document.getElementById('eventRaw').textContent = event.raw || 'Raw event not available';
      eventDialog.showModal();
    }

    async function loadEvents() {
      if (loading) return;
      loading = true;
      refreshBtn.disabled = true;
      document.getElementById('liveLabel').textContent = 'Refreshing';
      try {
        const params = new URLSearchParams({ table: tableSelect.value, limit: '50' });
        const response = await fetch(`/api/events?${params}`, { cache: 'no-store' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
        loadedEvents = result;
        document.getElementById('tableName').textContent = tableSelect.value;
        const newest = loadedEvents[0];
        document.getElementById('latestOffset').textContent = newest ? `p${newest.partition} / ${newest.offset}` : '-';
        document.getElementById('liveLabel').textContent = 'Connected';
        renderEvents();
      } catch (error) {
        document.getElementById('liveLabel').textContent = 'Feed unavailable';
        eventsList.replaceChildren(makeText('div', 'error', `Could not load events: ${error.message}`));
      } finally {
        refreshBtn.disabled = false;
        loading = false;
      }
    }

    tableSelect.addEventListener('change', loadEvents);
    operationSelect.addEventListener('change', renderEvents);
    refreshBtn.addEventListener('click', loadEvents);
    autoRefresh.addEventListener('change', () => {
      if (autoRefresh.checked) loadEvents();
    });
    document.getElementById('closeDialog').addEventListener('click', () => eventDialog.close());
    eventDialog.addEventListener('click', (event) => {
      if (event.target === eventDialog) eventDialog.close();
    });
    loadEvents();
    setInterval(() => { if (autoRefresh.checked) loadEvents(); }, 5000);
  </script>
</body>
</html>
